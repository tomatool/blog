{{/* A step-through diagram of how a black-box run collects code coverage. */}}
{{ $id := printf "flow-%d" .Ordinal }}
<figure class="explainer flow" id="{{ $id }}" data-step="0">
  <div class="flow-canvas">
  <svg viewBox="0 0 760 380" role="img" aria-labelledby="{{ $id }}-title">
    <title id="{{ $id }}-title">tomato drives the service while the service's coverage counters record what runs; on SIGTERM the service writes them out for the report.</title>
    <defs>
      <marker id="{{ $id }}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 10 5 0 10z" class="arrowhead" />
      </marker>
    </defs>

    <!-- tomato -->
    <g class="part p-tomato">
      <rect class="box" x="20" y="40" width="190" height="230" rx="10" />
      <circle class="fruit" cx="42" cy="64" r="7" /><rect class="stem" x="39" y="53" width="6" height="5" rx="1.5" />
      <text class="title" x="56" y="69">tomato run</text>
      <g class="scenarios">
        <g class="sc" style="--i:0"><text class="tick" x="36" y="104">✓</text><text class="sc-text" x="54" y="104">an order is placed</text></g>
        <g class="sc" style="--i:1"><text class="tick" x="36" y="132">✓</text><text class="sc-text" x="54" y="132">unknown product</text></g>
        <g class="sc" style="--i:2"><text class="tick" x="36" y="160">✓</text><text class="sc-text" x="54" y="160">catalog is down</text></g>
        <g class="sc" style="--i:3"><text class="tick" x="36" y="188">✓</text><text class="sc-text" x="54" y="188">malformed body</text></g>
      </g>
      <text class="muted" x="36" y="250">features/*.feature</text>
    </g>

    <!-- the service -->
    <g class="part p-app">
      <rect class="box app-box" x="290" y="40" width="200" height="230" rx="10" />
      <text class="title" x="306" y="69">orders</text>
      <text class="muted" x="364" y="69">your service</text>
      <text class="badge-text" x="306" y="92">go build -cover</text>
      <g class="counters">
        {{ range $i := seq 0 23 }}
          {{ $col := mod $i 6 }}{{ $row := div $i 6 }}
          <rect class="counter" data-n="{{ $i }}" x="{{ add 306 (mul $col 28) }}" y="{{ add 108 (mul $row 22) }}" width="22" height="15" rx="3" />
        {{ end }}
      </g>
      <text class="muted" x="306" y="214">coverage counters</text>
      <g class="env">
        <rect class="env-box" x="302" y="228" width="176" height="26" rx="6" />
        <text class="env-text" x="312" y="245">GOCOVERDIR=coverage/raw</text>
      </g>
    </g>

    <!-- dependencies and stubs -->
    <g class="part p-deps">
      <rect class="box dep" x="570" y="40" width="170" height="50" rx="10" />
      <text class="title" x="586" y="62">Postgres</text><text class="muted" x="586" y="80">container</text>
      <rect class="box dep" x="570" y="105" width="170" height="50" rx="10" />
      <text class="title" x="586" y="127">Kafka</text><text class="muted" x="586" y="145">container</text>
      <rect class="box dep stub" x="570" y="170" width="170" height="50" rx="10" />
      <text class="title" x="586" y="192">catalog</text><text class="muted" x="586" y="210">gRPC stub</text>
    </g>

    <!-- traffic -->
    <g class="part p-traffic">
      <path id="{{ $id }}-req" class="wire" d="M210 125 H290" marker-end="url(#{{ $id }}-arrow)" />
      <text class="wire-label" x="226" y="116">HTTP</text>
      <path id="{{ $id }}-db" class="wire" d="M490 85 L570 65" marker-end="url(#{{ $id }}-arrow)" />
      <path id="{{ $id }}-kafka" class="wire" d="M490 130 H570" marker-end="url(#{{ $id }}-arrow)" />
      <path id="{{ $id }}-grpc" class="wire" d="M490 175 L570 195" marker-end="url(#{{ $id }}-arrow)" />
      <g class="packets">
        <circle r="4" class="packet"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#{{ $id }}-req" /></animateMotion></circle>
        <circle r="4" class="packet"><animateMotion dur="1.4s" begin="0.5s" repeatCount="indefinite"><mpath href="#{{ $id }}-grpc" /></animateMotion></circle>
        <circle r="4" class="packet"><animateMotion dur="1.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#{{ $id }}-db" /></animateMotion></circle>
        <circle r="4" class="packet"><animateMotion dur="1.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#{{ $id }}-kafka" /></animateMotion></circle>
      </g>
    </g>

    <!-- stop -->
    <g class="part p-stop">
      <path class="wire sigterm" d="M210 225 H290" marker-end="url(#{{ $id }}-arrow)" />
      <text class="sig-label" x="214" y="216">SIGTERM</text>
    </g>

    <!-- data out -->
    <g class="part p-file">
      <path class="wire dashed" d="M390 270 V300" marker-end="url(#{{ $id }}-arrow)" />
      <rect class="box file" x="300" y="302" width="180" height="58" rx="10" />
      <text class="title" x="316" y="326">coverage/raw</text>
      <text class="muted" x="316" y="345">written when it exits</text>
    </g>

    <!-- report -->
    <g class="part p-report">
      <path class="wire" d="M480 331 H560" marker-end="url(#{{ $id }}-arrow)" />
      <rect class="box report" x="560" y="302" width="180" height="58" rx="10" />
      <text class="muted" x="576" y="322">go tool covdata</text>
      <text class="big" x="576" y="349">75%</text>
      <text class="gap-text" x="640" y="349">6 gaps</text>
    </g>
  </svg>
  </div>

  <figcaption>
    <div class="flow-steps" role="tablist">
      <button type="button" data-go="0">1 · Build</button>
      <button type="button" data-go="1">2 · Start</button>
      <button type="button" data-go="2">3 · Scenarios</button>
      <button type="button" data-go="3">4 · Stop</button>
      <button type="button" data-go="4">5 · Report</button>
    </div>
    <div class="flow-text" aria-live="polite">
      <p data-for="0"><strong>Build with coverage on.</strong> The service is built with counters compiled in (Go, Rust) or will run under its runtime's coverage agent (JVM, Python, Node.js). Nothing about the test changes.</p>
      <p data-for="1"><strong>tomato starts everything.</strong> It starts Postgres and Kafka in containers and a gRPC stub for the catalog service, then the service itself, which inherits tomato's environment, including the one variable that says where coverage goes.</p>
      <p data-for="2"><strong>Scenarios drive the service</strong> over HTTP, and the service talks to its dependencies and stubs as it would in production. Every line it runs ticks a counter <em>inside the service's process</em>; tomato never sees them.</p>
      <p data-for="3"><strong>tomato sends SIGTERM.</strong> The service shuts down cleanly, and on the way out its runtime writes the counters to the coverage directory. A process that is killed instead writes nothing.</p>
      <p data-for="4"><strong>The language's tool reads the data.</strong> The percentage is the least interesting part: the counters that never lit up are behaviour no scenario reached.</p>
    </div>
    <div class="flow-nav">
      <button type="button" class="ghost" data-prev aria-label="Previous step">←</button>
      <button type="button" class="ghost play" data-play>▶ Play</button>
      <button type="button" class="ghost" data-next aria-label="Next step">→</button>
    </div>
  </figcaption>
</figure>
<script>
(function () {
  var root = document.getElementById("{{ $id }}");
  var counters = Array.prototype.slice.call(root.querySelectorAll(".counter"));
  // The counters a run lights up, in order; the rest stay dark: the gaps.
  var order = [0, 6, 1, 7, 12, 2, 13, 8, 18, 3, 14, 19, 9, 4, 20, 15, 10, 21];
  var step = 0, timer = null, lighting = null;

  function light(upto) {
    counters.forEach(function (c) { c.classList.remove("lit", "gap"); });
    order.slice(0, upto).forEach(function (n) { counters[n].classList.add("lit"); });
  }
  function show(n) {
    step = Math.max(0, Math.min(4, n));
    root.dataset.step = step;
    root.querySelectorAll("[data-go]").forEach(function (b) { b.setAttribute("aria-selected", +b.dataset.go === step); });
    root.querySelectorAll("[data-for]").forEach(function (p) { p.hidden = +p.dataset.for !== step; });
    clearInterval(lighting);
    if (step < 2) light(0);
    else if (step === 2) {
      var k = 0; light(0);
      lighting = setInterval(function () { light(++k); if (k >= order.length) clearInterval(lighting); }, 140);
    } else light(order.length);
    if (step === 4) counters.forEach(function (c) { if (!c.classList.contains("lit")) c.classList.add("gap"); });
  }
  var touched = false; // once the reader drives it, it is theirs
  function stop() { clearInterval(timer); timer = null; root.querySelector("[data-play]").textContent = "▶ Play"; }
  function play() {
    if (timer) return;
    root.querySelector("[data-play]").textContent = "❚❚ Pause";
    show(step >= 4 ? 0 : step);
    timer = setInterval(function () { if (step >= 4) stop(); else show(step + 1); }, 3600);
  }
  function manual() { touched = true; stop(); }
  root.querySelectorAll("[data-go]").forEach(function (b) { b.addEventListener("click", function () { manual(); show(+b.dataset.go); }); });
  root.querySelector("[data-prev]").addEventListener("click", function () { manual(); show(step - 1); });
  root.querySelector("[data-next]").addEventListener("click", function () { manual(); show(step + 1); });
  root.querySelector("[data-play]").addEventListener("click", function () {
    touched = true;
    if (timer) stop(); else play();
  });

  // Play on its own the first time it scrolls into view, and pause while it
  // is out of view; not for readers who asked for less motion.
  var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var played = false;
  if ("IntersectionObserver" in window && !calm && !/flow=/.test(location.search)) {
    new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && !touched) {
          if (!played) { played = true; show(0); }
          play();
        } else if (!e.isIntersecting && timer && !touched) {
          stop();
        }
      });
    }, { threshold: 0.6 }).observe(root.querySelector("svg"));
  }
  var m = location.search.match(/flow=(\d)/);
  show(m ? +m[1] : 0);
})();
</script>
